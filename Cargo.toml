[package]
name = "winrmpc"
version = "0.4.2"
edition = "2021"
description = "A modern MPD client with album art, lyrics, partitions, outputs and Snapcast control"
license = "MIT"

[dependencies]
iced = { version = "0.13", features = ["tokio", "image", "svg", "advanced"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
redb = "4"
image = { version = "0.25", features = ["jpeg", "png", "webp", "gif"] }
# rustls, not the default native-tls: on Linux native-tls means OpenSSL, so
# only the Linux build would need libssl headers to compile and a matching
# libssl soname to run — a binary built on one distro could fail to start on
# another. rustls is the same pure-Rust stack on all three platforms.
#
# `default-features = false` drops more than TLS, so `charset`, `http2` and
# `macos-system-configuration` are re-added deliberately: without the last one
# macOS silently stops honouring system proxy settings, which is exactly the
# one-platform-only regression this whole batch of work is about.
#
# native-roots (not webpki-roots) so a corporate MITM proxy or a custom CA in
# the OS trust store keeps working.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "charset",
    "http2",
    "macos-system-configuration",
    "rustls-tls-native-roots",
] }
directories = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
chrono = "0.4"
flume = "0.11"
fuzzy-matcher = "0.3"
open = "5"
urlencoding = "2"

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
